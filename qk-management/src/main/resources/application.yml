spring:
  datasource:
    # 数据库的链接地址
    url: jdbc:mysql://localhost:3306/qk?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false
    # 数据库的用户名
    username: root
    # 数据库的密码
    password: 1234
    # 数据驱动jar的种类
    driver-class-name: com.mysql.cj.jdbc.Driver




# 设置mybatis-plus的日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # id生成策略
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 将oss的动态变化的参数配置到配置文件中
ali:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: ai5mjj
    region: cn-beijing
jwt:
  secret: itheima


